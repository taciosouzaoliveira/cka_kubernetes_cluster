<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>

  <!-- Titulo -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0b2a3d">Arquitetura de rede do lab CKA</text>
  <text x="40" y="68" font-size="13" fill="#5b6675">kubeadm v1.35 · containerd · Flannel VXLAN · VMs libvirt provisionadas por Terraform e configuradas por Ansible</text>

  <!-- Internet -->
  <rect x="430" y="92" width="140" height="40" rx="20" fill="#eef3f7" stroke="#8a99a8"/>
  <text x="500" y="117" font-size="14" font-weight="600" fill="#1f2d3a" text-anchor="middle">Internet</text>
  <line x1="500" y1="132" x2="500" y2="160" stroke="#4a5563" stroke-width="2"/>

  <!-- LAN -->
  <rect x="380" y="160" width="240" height="44" rx="6" fill="#eef3f7" stroke="#8a99a8"/>
  <text x="500" y="180" font-size="14" font-weight="600" fill="#1f2d3a" text-anchor="middle">Roteador / LAN doméstica</text>
  <text x="500" y="196" font-size="12" fill="#5b6675" text-anchor="middle">rede física</text>
  <line x1="500" y1="204" x2="500" y2="236" stroke="#4a5563" stroke-width="2"/>
  <text x="510" y="226" font-size="12" fill="#5b6675">192.168.100.10</text>

  <!-- Host -->
  <rect x="30" y="236" width="940" height="488" rx="10" fill="#f7f9fb" stroke="#0b5c86" stroke-width="2"/>
  <text x="50" y="262" font-size="15" font-weight="700" fill="#0b5c86">Host Dell — KVM / libvirt (qemu:///system)</text>
  <text x="50" y="280" font-size="12" fill="#5b6675">Terraform (provider dmacvicar/libvirt) cria rede, discos qcow2 e VMs Ubuntu 22.04</text>

  <!-- Bridge NAT -->
  <rect x="60" y="300" width="880" height="54" rx="6" fill="#e3f1f9" stroke="#049fd9" stroke-width="1.5"/>
  <text x="80" y="323" font-size="14" font-weight="700" fill="#0b2a3d">Rede libvirt k8s-network-devops  ·  modo NAT  ·  10.17.4.0/24</text>
  <text x="80" y="342" font-size="12" fill="#3d4b59">Gateway 10.17.4.1 (bridge no host)  ·  DHCP e DNS pelo dnsmasq  ·  saída para a LAN via NAT do host</text>

  <!-- Links bridge -> VMs -->
  <line x1="200" y1="354" x2="200" y2="390" stroke="#4a5563" stroke-width="2"/>
  <line x1="500" y1="354" x2="500" y2="390" stroke="#4a5563" stroke-width="2"/>
  <line x1="800" y1="354" x2="800" y2="390" stroke="#4a5563" stroke-width="2"/>
  <text x="208" y="378" font-size="12" fill="#3d4b59">10.17.4.179</text>
  <text x="508" y="378" font-size="12" fill="#3d4b59">10.17.4.242</text>
  <text x="808" y="378" font-size="12" fill="#3d4b59">10.17.4.149</text>

  <!-- VM controlplane -->
  <rect x="70" y="390" width="260" height="200" rx="8" fill="#ffffff" stroke="#0b5c86" stroke-width="1.5"/>
  <rect x="70" y="390" width="260" height="34" rx="8" fill="#0b5c86"/>
  <rect x="70" y="410" width="260" height="14" fill="#0b5c86"/>
  <text x="200" y="412" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">controlplane</text>
  <text x="86" y="444" font-size="12" fill="#5b6675">VM k8s-controlplane-devops</text>
  <text x="86" y="461" font-size="12" fill="#5b6675">2 vCPU · 3 GB RAM · 40 GB</text>
  <text x="86" y="486" font-size="12" font-weight="600" fill="#1f2d3a">kube-apiserver :6443</text>
  <text x="86" y="503" font-size="12" fill="#1f2d3a">etcd · scheduler · controller-manager</text>
  <text x="86" y="520" font-size="12" fill="#1f2d3a">kubelet · kube-proxy · containerd</text>
  <rect x="86" y="534" width="228" height="42" rx="4" fill="#fff6e5" stroke="#d99a1e"/>
  <text x="96" y="551" font-size="12" font-weight="600" fill="#6b4a0b">cni0 + flannel.1</text>
  <text x="96" y="567" font-size="12" fill="#6b4a0b">Pods: uma /24 de 10.244.0.0/16</text>

  <!-- VM worker-1 -->
  <rect x="370" y="390" width="260" height="200" rx="8" fill="#ffffff" stroke="#0b5c86" stroke-width="1.5"/>
  <rect x="370" y="390" width="260" height="34" rx="8" fill="#2f7fa8"/>
  <rect x="370" y="410" width="260" height="14" fill="#2f7fa8"/>
  <text x="500" y="412" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">worker-1</text>
  <text x="386" y="444" font-size="12" fill="#5b6675">VM k8s-worker-1-devops</text>
  <text x="386" y="461" font-size="12" fill="#5b6675">2 vCPU · 2 GB RAM · 20 GB</text>
  <text x="386" y="486" font-size="12" font-weight="600" fill="#1f2d3a">Cargas de trabalho</text>
  <text x="386" y="503" font-size="12" fill="#1f2d3a">kubelet · kube-proxy · containerd</text>
  <text x="386" y="520" font-size="12" fill="#1f2d3a">kube-flannel (DaemonSet)</text>
  <rect x="386" y="534" width="228" height="42" rx="4" fill="#fff6e5" stroke="#d99a1e"/>
  <text x="396" y="551" font-size="12" font-weight="600" fill="#6b4a0b">cni0 + flannel.1</text>
  <text x="396" y="567" font-size="12" fill="#6b4a0b">Pods: uma /24 de 10.244.0.0/16</text>

  <!-- VM worker-2 -->
  <rect x="670" y="390" width="260" height="200" rx="8" fill="#ffffff" stroke="#0b5c86" stroke-width="1.5"/>
  <rect x="670" y="390" width="260" height="34" rx="8" fill="#2f7fa8"/>
  <rect x="670" y="410" width="260" height="14" fill="#2f7fa8"/>
  <text x="800" y="412" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">worker-2</text>
  <text x="686" y="444" font-size="12" fill="#5b6675">VM k8s-worker-2-devops</text>
  <text x="686" y="461" font-size="12" fill="#5b6675">2 vCPU · 2 GB RAM · 20 GB</text>
  <text x="686" y="486" font-size="12" font-weight="600" fill="#1f2d3a">Cargas de trabalho</text>
  <text x="686" y="503" font-size="12" fill="#1f2d3a">kubelet · kube-proxy · containerd</text>
  <text x="686" y="520" font-size="12" fill="#1f2d3a">kube-flannel (DaemonSet)</text>
  <rect x="686" y="534" width="228" height="42" rx="4" fill="#fff6e5" stroke="#d99a1e"/>
  <text x="696" y="551" font-size="12" font-weight="600" fill="#6b4a0b">cni0 + flannel.1</text>
  <text x="696" y="567" font-size="12" fill="#6b4a0b">Pods: uma /24 de 10.244.0.0/16</text>

  <!-- Overlay VXLAN -->
  <line x1="314" y1="608" x2="386" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="614" y1="608" x2="686" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="576" x2="200" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="500" y1="576" x2="500" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="800" y1="576" x2="800" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="200" y1="608" x2="314" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="386" y1="608" x2="614" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="686" y1="608" x2="800" y2="608" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="60" y="624" width="430" height="80" rx="6" fill="#fff6e5" stroke="#d99a1e"/>
  <text x="76" y="646" font-size="13" font-weight="700" fill="#6b4a0b">Rede de Pods (Flannel)</text>
  <text x="76" y="665" font-size="12" fill="#6b4a0b">CIDR 10.244.0.0/16 (kubeadm --pod-network-cidr)</text>
  <text x="76" y="682" font-size="12" fill="#6b4a0b">Túnel VXLAN entre os nós, UDP 8472</text>
  <text x="76" y="699" font-size="12" fill="#6b4a0b">encapsulado sobre a rede 10.17.4.0/24</text>

  <rect x="510" y="624" width="430" height="80" rx="6" fill="#eef7ee" stroke="#4f9a52"/>
  <text x="526" y="646" font-size="13" font-weight="700" fill="#1f4d21">Rede de Services</text>
  <text x="526" y="665" font-size="12" fill="#1f4d21">CIDR 10.96.0.0/12 (padrão do kubeadm)</text>
  <text x="526" y="682" font-size="12" fill="#1f4d21">ClusterIP via kube-proxy (iptables)</text>
  <text x="526" y="699" font-size="12" fill="#1f4d21">CoreDNS em 10.96.0.10</text>

  <!-- Legenda -->
  <line x1="40" y1="744" x2="70" y2="744" stroke="#4a5563" stroke-width="2"/>
  <text x="78" y="748" font-size="12" fill="#3d4b59">Enlace de rede</text>
  <line x1="190" y1="744" x2="220" y2="744" stroke="#d99a1e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="228" y="748" font-size="12" fill="#3d4b59">Túnel VXLAN (overlay)</text>
  <text x="400" y="748" font-size="12" fill="#5b6675">IPs das VMs vêm do DHCP da libvirt e podem mudar a cada terraform apply.</text>
</svg>
